<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Agent Runner architecture: both SubprocessAgentRunner and ClaudeCodeAgentRunner implement the same AgentRunner interface, but SubprocessAgentRunner keeps one long-lived process alive for every turn in a worker run, while ClaudeCodeAgentRunner spawns a brand-new claude process per turn and stitches continuity together with --resume instead of a shared process.">
  <title>Agent Runner Architecture</title>
  <desc>The Orchestrator calls one shared AgentRunner interface: startSession returns an AgentSession, whose startTurn and stop methods drive each turn. SubprocessAgentRunner implements this by spawning one bash -lc codex.command process at session start and sending every turn down its stdin, keeping it alive for the whole worker run. ClaudeCodeAgentRunner implements the same interface by spawning a fresh claude -p process for every single turn -- the first with --session-id, later ones with --resume of that same id -- so conversation continuity comes from a passed identifier rather than a persisting process; stop() only has something to kill if a turn happens to be in flight.</desc>

  <rect x="0" y="0" width="1200" height="900" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Agent Runner Architecture</text>
  <text x="600" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">One interface, two opposite process lifetimes</text>

  <!-- Orchestrator -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="480" y="80" width="240" height="46" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="600" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Orchestrator</text>
  </g>
  <line x1="600" y1="126" x2="600" y2="150" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- AgentRunner interface -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="330" y="150" width="540" height="106" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5" />
    <text x="600" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">AgentRunner interface (src/agent/runner.ts)</text>
    <text x="600" y="194" text-anchor="middle" font-size="11" fill="#3730a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">startSession(workspacePath, issue, codexConfig) &#8594; AgentSession</text>
    <text x="600" y="212" text-anchor="middle" font-size="11" fill="#3730a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AgentSession.startTurn(prompt, title) &#8594; TurnOutcome</text>
    <text x="600" y="230" text-anchor="middle" font-size="11" fill="#3730a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AgentSession.stop()</text>
    <text x="600" y="248" text-anchor="middle" font-size="10" fill="#4f46e5" font-style="italic">both runners below implement exactly this &#8212; nothing else is shared</text>
  </g>

  <line x1="440" y1="256" x2="310" y2="288" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="410" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#334155">implements</text>
  <line x1="760" y1="256" x2="890" y2="288" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="790" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#334155">implements</text>

  <!-- Lane headers -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="150" y="290" width="300" height="50" rx="8" fill="#f8fafc" stroke="#4338ca" stroke-width="2.25" />
    <text x="300" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">SubprocessAgentRunner</text>
    <text x="300" y="328" text-anchor="middle" font-size="10" fill="#4338ca">src/agent/subprocessRunner.ts</text>

    <rect x="750" y="290" width="300" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.25" />
    <text x="900" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ClaudeCodeAgentRunner</text>
    <text x="900" y="328" text-anchor="middle" font-size="10" fill="#b45309">src/agent/claudeCodeRunner.ts</text>
  </g>

  <!-- ================= LEFT LANE: one persistent process ================= -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="300" y1="340" x2="300" y2="366" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="313" y="357" font-size="10.5" fill="#334155">startSession()</text>

    <rect x="340" y="366" width="190" height="420" rx="10" fill="#f8fafc" stroke="#4338ca" stroke-width="2.25" />
    <text x="435" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bash -lc</text>
    <text x="435" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;codex.command&gt;</text>
    <text x="435" y="428" text-anchor="middle" font-size="10" fill="#3730a3">ONE process for the</text>
    <text x="435" y="442" text-anchor="middle" font-size="10" fill="#3730a3">whole worker run</text>

    <!-- Turn 1 -->
    <text x="255" y="450" text-anchor="middle" font-size="10">startTurn(prompt) &#8594;</text>
    <line x1="170" y1="460" x2="340" y2="460" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="255" y="472" text-anchor="middle" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdin: turn.start</text>

    <line x1="340" y1="496" x2="170" y2="496" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="255" y="512" text-anchor="middle" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdout: turn.completed</text>

    <text x="255" y="548" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">(loop continues on the</text>
    <text x="255" y="561" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">SAME process for later turns)</text>

    <!-- Turn 2 -->
    <text x="255" y="596" text-anchor="middle" font-size="10">startTurn(prompt) &#8594;</text>
    <line x1="170" y1="606" x2="340" y2="606" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="255" y="618" text-anchor="middle" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdin: turn.start</text>

    <line x1="340" y1="642" x2="170" y2="642" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="255" y="658" text-anchor="middle" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdout: turn.completed</text>

    <!-- stop -->
    <text x="255" y="722" text-anchor="middle" font-size="10">stop() &#8594;</text>
    <line x1="170" y1="732" x2="340" y2="732" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="255" y="744" text-anchor="middle" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stdin: session.stop</text>
    <text x="255" y="762" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">SIGTERM, then SIGKILL</text>
    <text x="255" y="775" text-anchor="middle" font-size="9.5" fill="#64748b" font-style="italic">after a grace period</text>
  </g>

  <!-- ================= RIGHT LANE: fresh process per turn ================= -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="900" y1="340" x2="900" y2="366" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="913" y="352" font-size="10.5" fill="#334155">startSession()</text>
    <text x="913" y="365" font-size="9.5" fill="#64748b" font-style="italic">preflight only</text>

    <rect x="800" y="366" width="200" height="48" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5 4" />
    <text x="900" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude --version</text>
    <text x="900" y="402" text-anchor="middle" font-size="9.5" fill="#64748b">(no process kept)</text>

    <line x1="900" y1="414" x2="900" y2="444" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="913" y="432" font-size="10" fill="#334155">startTurn(prompt 1)</text>

    <rect x="770" y="444" width="260" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <text x="900" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude -p &lt;prompt1&gt;</text>
    <text x="900" y="484" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--session-id &lt;uuid&gt;</text>
    <text x="900" y="502" text-anchor="middle" font-size="9.5" fill="#92400e">its own process &#8212;</text>
    <text x="900" y="515" text-anchor="middle" font-size="9.5" fill="#92400e">exits when this turn ends</text>

    <line x1="900" y1="530" x2="900" y2="558" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="913" y="542" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exit 0 &#8594; result</text>
    <text x="913" y="554" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{is_error:false}</text>

    <line x1="900" y1="558" x2="900" y2="602" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)" />
    <text x="913" y="578" font-size="9.5" fill="#64748b" font-style="italic">same &lt;uuid&gt; carried via</text>
    <text x="913" y="591" font-size="9.5" fill="#64748b" font-style="italic">--resume (no shared process)</text>

    <rect x="770" y="606" width="260" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <text x="900" y="630" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude -p &lt;prompt2&gt;</text>
    <text x="900" y="646" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--resume &lt;uuid&gt;</text>
    <text x="900" y="664" text-anchor="middle" font-size="9.5" fill="#92400e">a NEW process &#8212;</text>
    <text x="900" y="677" text-anchor="middle" font-size="9.5" fill="#92400e">exits when this turn ends</text>

    <line x1="900" y1="692" x2="900" y2="720" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
    <text x="913" y="704" font-size="9.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exit 0 &#8594; result</text>

    <rect x="770" y="730" width="260" height="56" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="5 4" />
    <text x="900" y="750" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">stop()</text>
    <text x="900" y="765" text-anchor="middle" font-size="9.5" fill="#64748b">kills the in-flight turn's process,</text>
    <text x="900" y="778" text-anchor="middle" font-size="9.5" fill="#64748b">if any &#8212; otherwise a no-op</text>
  </g>

  <!-- Caption -->
  <text x="600" y="840" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Same contract, opposite process lifetimes: one subprocess carries every turn on the left;</text>
  <text x="600" y="858" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">a fresh process per turn, stitched together by --resume &lt;uuid&gt;, on the right.</text>
</svg>
