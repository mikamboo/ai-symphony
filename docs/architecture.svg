<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" role="img" aria-label="Symphony architecture: WORKFLOW.md feeds the Workflow Loader and Config Layer into a central Orchestrator, which polls a pluggable Tracker Adapter, drives a pluggable Agent Runner, manages a sandboxed per-issue workspace, and emits structured logs.">
  <title>Symphony Architecture</title>
  <desc>WORKFLOW.md drives a Workflow Loader and Config Layer that feed the Orchestrator. The Orchestrator polls the Tracker Adapter for issues, tells the Workspace Manager to create/reuse a sandboxed per-issue workspace, and drives the Agent Runner to spawn a coding-agent subprocess inside that workspace. The Agent Runner reports events back to the Orchestrator, which also emits structured logs, and re-polls on a fixed interval.</desc>

  <rect x="0" y="0" width="1040" height="780" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="520" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Symphony Architecture</text>
  <text x="520" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">WORKFLOW.md drives a poll &#8594; dispatch &#8594; reconcile &#8594; retry loop around a sandboxed per-issue workspace</text>

  <!-- WORKFLOW.md file -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M420,90 h172 l28,28 v22 a8,8 0 0 1 -8,8 h-192 a8,8 0 0 1 -8,-8 v-42 a8,8 0 0 1 8,-8 z" fill="#f8fafc" stroke="#1e293b" stroke-width="2" stroke-linejoin="round" />
    <path d="M592,90 v28 h28" fill="none" stroke="#1e293b" stroke-width="2" stroke-linejoin="round" />
    <text x="520" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">WORKFLOW.md</text>
    <text x="520" y="138" text-anchor="middle" font-size="10.5" fill="#475569">front matter + prompt template</text>
  </g>

  <line x1="520" y1="148" x2="520" y2="168" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="533" y="162" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">load / watch for changes</text>

  <!-- Workflow Loader -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="370" y="170" width="300" height="58" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="520" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Workflow Loader</text>
    <text x="520" y="210" text-anchor="middle" font-size="10.5" fill="#475569">parses front matter &#183; watches file for live reload</text>
  </g>

  <line x1="520" y1="228" x2="520" y2="248" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="533" y="242" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">config map</text>

  <!-- Config Layer -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="370" y="250" width="300" height="50" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="520" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Config Layer</text>
    <text x="520" y="287" text-anchor="middle" font-size="10.5" fill="#475569">$VAR / ~ expansion &#183; typed defaults &#183; validation</text>
  </g>

  <line x1="520" y1="300" x2="520" y2="320" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="533" y="314" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">ServiceConfig</text>

  <!-- Orchestrator hub -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="350" y="322" width="340" height="130" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5" />
    <text x="520" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b4b">Orchestrator</text>
    <text x="520" y="372" text-anchor="middle" font-size="11" fill="#3730a3">poll every polling.interval_ms</text>
    <text x="520" y="390" text-anchor="middle" font-size="11" fill="#3730a3">dispatch &#8594; reconcile &#8594; retry (backoff queue)</text>
    <text x="520" y="408" text-anchor="middle" font-size="11" fill="#3730a3">single authoritative in-memory state</text>
    <text x="520" y="432" text-anchor="middle" font-size="10" fill="#4f46e5" font-style="italic">(the state machine described in SPEC.md &#167;16)</text>
  </g>

  <!-- Tracker Adapter -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="335" width="230" height="110" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="155" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Tracker Adapter</text>
    <text x="155" y="380" text-anchor="middle" font-size="10.5" fill="#475569">Linear &#183; Mock (pluggable)</text>
    <text x="155" y="398" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">fetch_issues_by_states(...)</text>
    <text x="155" y="412" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">fetch_issues_by_ids(...)</text>
    <text x="155" y="432" text-anchor="middle" font-size="9.5" fill="#94a3b8">implements TrackerAdapter</text>
  </g>

  <!-- Agent Runner -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="770" y="335" width="230" height="110" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="885" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent Runner</text>
    <text x="885" y="380" text-anchor="middle" font-size="10.5" fill="#475569">SubprocessAgentRunner (reference)</text>
    <text x="885" y="398" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">startSession(...) / startTurn(...)</text>
    <text x="885" y="416" text-anchor="middle" font-size="9.5" fill="#94a3b8">decoupled from any one agent's wire</text>
    <text x="885" y="430" text-anchor="middle" font-size="9.5" fill="#94a3b8">protocol &#8212; implements AgentRunner</text>
  </g>

  <!-- Workspace Manager -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="395" y="484" width="250" height="56" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="520" y="507" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Workspace Manager</text>
    <text x="520" y="523" text-anchor="middle" font-size="10.5" fill="#475569">sanitized workspace_key &#183; lifecycle hooks</text>
  </g>

  <!-- Workspace root (sandbox) container -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="350" y="578" width="340" height="130" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
    <text x="365" y="596" font-size="10.5" font-style="italic" fill="#64748b">workspace.root / &lt;workspace_key&gt;  (sandboxed: SPEC.md &#167;9.5)</text>

    <rect x="395" y="616" width="250" height="66" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="520" y="640" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Coding agent subprocess</text>
    <text x="520" y="656" text-anchor="middle" font-size="10" fill="#475569">cwd = workspace path (never outside root)</text>
    <text x="520" y="672" text-anchor="middle" font-size="9.5" fill="#94a3b8">stdin/stdout: reference JSON protocol</text>
  </g>

  <!-- Logging -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="485" width="230" height="70" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="155" y="509" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Structured Logging</text>
    <text x="155" y="525" text-anchor="middle" font-size="10.5" fill="#475569">key=value &#183; secret redaction</text>
    <text x="155" y="541" text-anchor="middle" font-size="9.5" fill="#94a3b8">issue_id / issue_identifier / session_id</text>
  </g>

  <!-- All connectors drawn last so their labels are never clipped by a box painted on top -->

  <!-- Orchestrator <-> Tracker Adapter -->
  <line x1="350" y1="370" x2="272" y2="370" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="311" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">poll</text>
  <line x1="272" y1="410" x2="350" y2="410" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="311" y="426" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">issues[]</text>

  <!-- Orchestrator <-> Agent Runner -->
  <line x1="690" y1="370" x2="768" y2="370" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="729" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">start turn</text>
  <line x1="768" y1="410" x2="690" y2="410" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="729" y="426" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">events</text>

  <!-- Orchestrator -> Workspace Manager -->
  <line x1="520" y1="452" x2="520" y2="482" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="533" y="472" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">create/reuse + run hooks</text>

  <!-- Workspace Manager -> workspace root -->
  <line x1="520" y1="540" x2="520" y2="576" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="533" y="562" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">creates / cleans up</text>

  <!-- Agent Runner -> coding agent subprocess (elbow, routed above the workspace-root box so its label never overlaps the box's own inner caption) -->
  <polyline points="885,445 885,562 645,562 645,614" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="765" y="555" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">spawns: bash -lc &lt;codex.command&gt;</text>

  <!-- Orchestrator -> Logging -->
  <polyline points="400,452 400,466 155,466 155,483" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="278" y="463" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">structured logs</text>

  <!-- Caption -->
  <text x="520" y="740" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Every arrow between the Orchestrator and a spoke (Tracker Adapter, Agent Runner) crosses an interface</text>
  <text x="520" y="757" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">(TrackerAdapter, AgentRunner) &#8212; swap either side without touching orchestration logic.</text>
</svg>
